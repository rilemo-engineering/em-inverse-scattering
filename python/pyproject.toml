[tool.poetry]
name = "inverse-scattering"
version = "0.1.0"
description = "Python port of 2D TM electromagnetic inverse scattering exercises using Born approximation and TSVD regularization"
authors = ["Inverse Scattering Team"]
readme = "README.md"
packages = [{include = "inverse_scattering"}]

[tool.poetry.dependencies]
python = "^3.9"
numpy = "^1.24.0"
scipy = "^1.11.0"
matplotlib = "^3.7.0"
h5py = "^3.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-xdist = "^3.3.0"
ipython = "^8.14.0"

[tool.poetry.scripts]
run-scenario = "inverse_scattering.scripts.scenario:main"
run-inversion = "inverse_scattering.scripts.inversion_born:main"
run-exp-scenario = "inverse_scattering.scripts.scenario_exp:main"
run-exp-inversion = "inverse_scattering.scripts.inversion_exp_born:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "reference: marks tests that compare against MATLAB reference data",
]

[tool.coverage.run]
source = ["inverse_scattering"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
fail_under = 70
